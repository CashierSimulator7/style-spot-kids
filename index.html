<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Style Spot Kids POS</title><style>
:root{color-scheme:light dark;--bg:light-dark(#f5f4f1,#171717);--panel:light-dark(#fff,#242424);--text:light-dark(#171717,#f5f5f5);--muted:light-dark(#6b6b6b,#aaa);--border:light-dark(#ddd,#444);--accent:light-dark(#1f2937,#f3f4f6);--accentText:light-dark(#fff,#111)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}#app{min-height:100vh;background:var(--bg)}header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:15px}h1{margin:0;font-size:26px}.sub{color:var(--muted);font-size:14px;margin-top:3px}.wrap{display:grid;grid-template-columns:1.4fr .85fr;gap:18px;padding:18px;max-width:1280px;margin:auto}.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:12px;padding:13px 18px;cursor:pointer;font-size:16px;min-height:48px;touch-action:manipulation}.tab.active{background:var(--accent);color:var(--accentText)}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.product{padding:17px;border:1px solid var(--border);border-radius:14px;background:transparent;color:var(--text);text-align:left;cursor:pointer;min-height:112px;font-size:16px;touch-action:manipulation}.product:hover{border-color:var(--text)}.price{font-weight:700;font-size:18px;margin-top:8px}.sizes{color:var(--muted);font-size:13px;margin-top:6px}.cartrow{border-bottom:1px solid var(--border);padding:14px 0;display:flex;justify-content:space-between;gap:10px;font-size:16px}.cartrow small{color:var(--muted);display:block;margin-top:3px}.remove{border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;border-radius:8px;min-width:42px;min-height:42px;font-size:20px}.total{font-size:24px;font-weight:800;display:flex;justify-content:space-between;padding-top:17px}.select,.cash{width:100%;padding:15px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);font-size:18px;margin-top:8px;min-height:52px}.btn{width:100%;padding:15px;border:0;border-radius:10px;background:var(--accent);color:var(--accentText);font-weight:700;font-size:17px;cursor:pointer;margin-top:12px;min-height:52px;touch-action:manipulation}.message{margin-top:12px;padding:14px;border-radius:10px;background:light-dark(#f0f0ed,#303030);font-size:15px}.empty{color:var(--muted);padding:30px 0;text-align:center}@media(max-width:900px){.wrap{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.products{grid-template-columns:1fr}header{padding:15px 16px}.wrap{padding:12px}.panel{padding:15px}}
</style></head><body><main id="app"><header><div><h1>Style Spot Kids</h1><div class="sub">Cash Register Practice • Children's Clothing</div></div><button class="tab" id="clear">New Transaction</button></header><div class="wrap"><section class="panel"><div class="tabs"><button class="tab active" data-cat="All">All</button><button class="tab" data-cat="Shirts">Shirts</button><button class="tab" data-cat="Pants">Pants</button></div><div class="products" id="products"></div></section><aside class="panel"><h2 style="margin:0 0 10px">Current Sale</h2><div id="cart"></div><div class="total"><span>Total</span><span id="total">$0.00</span></div><label style="display:block;margin-top:18px;font-size:13px">Customer pays with</label><input id="cash" class="cash" type="number" min="0" step="0.01" placeholder="e.g. 50.00"><button class="btn" id="pay">Complete Cash Sale</button><div id="message" aria-live="polite"></div></aside></div></main><script>
const items=[
{name:'Short-Sleeve Shirt',cat:'Shirts',price:12.99,sizes:['4T','5T','6','7','8','10','12']},
{name:'Long-Sleeve Shirt',cat:'Shirts',price:15.99,sizes:['4T','5T','6','7','8','10','12']},
{name:'Pants',cat:'Pants',price:19.99,sizes:['4T','5T','6','7','8','10','12']},
{name:'Shorts',cat:'Pants',price:14.99,sizes:['4T','5T','6','7','8','10','12']}
];let cart=[];let cat='All';
const money=n=>'$'+n.toFixed(2);function renderProducts(){products.innerHTML='';items.filter(x=>cat==='All'||x.cat===cat).forEach((x,i)=>{const b=document.createElement('button');b.className='product';b.innerHTML='<strong>'+x.name+'</strong><div class="price">'+money(x.price)+'</div><div class="sizes">Sizes: '+x.sizes.join(', ')+'</div>';b.onclick=()=>add(x);products.appendChild(b)})}function add(x){const existing=document.getElementById('sizePicker');if(existing)existing.remove();const overlay=document.createElement('div');overlay.id='sizePicker';overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10';const box=document.createElement('div');box.style.cssText='background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:18px;padding:22px;max-width:460px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.25)';box.innerHTML='<h2 style="margin:0 0 6px">Choose a size</h2><div style="color:var(--muted);margin-bottom:16px">'+x.name+'</div>';const grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:10px';x.sizes.forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s;b.style.cssText='min-height:58px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--text);font-size:18px;font-weight:700;touch-action:manipulation';b.onclick=()=>{cart.push({name:x.name,size:s,price:x.price});overlay.remove();renderCart()};grid.appendChild(b)});box.appendChild(grid);const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Cancel';cancel.style.cssText='width:100%;min-height:52px;margin-top:14px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--text);font-size:16px';cancel.onclick=()=>overlay.remove();box.appendChild(cancel);overlay.appendChild(box);document.body.appendChild(overlay)}function renderCart(){cartEl.innerHTML=cart.length?cart.map((x,i)=>'<div class="cartrow"><div><strong>'+x.name+'</strong><small>Size '+x.size+'</small></div><div>'+money(x.price)+' <button class="remove" data-i="'+i+'">×</button></div></div>').join(''):'<div class="empty">No items yet.<br>Select clothing to start.</div>';document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.i,1);renderCart()});const t=cart.reduce((a,x)=>a+x.price,0);total.textContent=money(t);message.innerHTML=''}
const products=document.getElementById('products'),cartEl=document.getElementById('cart'),total=document.getElementById('total'),message=document.getElementById('message');document.querySelectorAll('.tab[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab[data-cat]').forEach(z=>z.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;renderProducts()});document.getElementById('pay').onclick=()=>{const t=cart.reduce((a,x)=>a+x.price,0),cashAmt=Number(document.getElementById('cash').value);if(!cart.length){message.innerHTML='<div class="message">Add at least one item first.</div>';return}if(!Number.isFinite(cashAmt)||cashAmt<t){message.innerHTML='<div class="message">Payment is not enough. The customer needs at least '+money(t)+'.</div>';return}message.innerHTML='<div class="message"><strong>Sale complete!</strong><br>Customer paid '+money(cashAmt)+'.<br>Give back <strong>'+money(cashAmt-t)+'</strong> in change.</div>'};document.getElementById('clear').onclick=()=>{cart=[];document.getElementById('cash').value='';renderCart()};renderProducts();renderCart();
</script></body></html>
